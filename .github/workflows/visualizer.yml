name: Two Sum visualizer

on:
  push:
    branches: [main]
    paths:
      - "visualizer/**"
      - ".github/workflows/visualizer.yml"
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy to GitHub Pages"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: visualizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visualizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: visualizer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Upload downloadable offline example
        uses: actions/upload-artifact@v4
        with:
          name: two-sum-visualizer
          path: visualizer/dist/
      - name: Prepare Pages artifact
        if: ${{ github.event_name == 'push' || inputs.deploy_pages }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: visualizer/dist/

  deploy:
    if: ${{ github.event_name == 'push' || inputs.deploy_pages }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy visualizer
        id: deployment
        uses: actions/deploy-pages@v4
